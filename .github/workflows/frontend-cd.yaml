name: Frontend CD

on:
  push:
    branches:
      - master
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${{ secrets.REACT_APP_MOVIE_API_URL }}" \
            -t ${{ steps.login-ecr.outputs.registry }}/frontend:latest .

      - name: Push frontend image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/frontend:latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name cluster

      - name: Deploy frontend
        run: |
          kubectl apply -k starter/frontend/k8s/
          kubectl rollout restart deployment/frontend
          kubectl rollout status deployment/frontend --timeout=180s
